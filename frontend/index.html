<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>الخيال POS</title>
  <link rel="icon" type="image/png" href="assets/alkhayal-mark.png">
  <link rel="stylesheet" href="css/tokens.css"><link rel="stylesheet" href="css/themes.css"><link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/modules.css">
</head>
<body>
  <div class="app-shell" id="appShell">
    <main class="app-main">
      <header class="topbar">
        <div class="topbar-brand"><span class="brand-symbol brand-mark" aria-hidden="true"><img src="assets/alkhayal-mark.png" alt=""></span><span class="brand-copy">الخيال <small>ALKHAYAL POS</small></span><span class="badge info" id="branchBadge">الفرع الرئيسي</span></div>
        <div class="global-search"><span class="global-search-icon" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m16 16 5 5"></path></svg></span><label class="sr-only" for="globalSearch">البحث في الشاشات</label><input id="globalSearch" autocomplete="off" placeholder="ابحث عن شاشة أو إجراء…"><div class="search-results" id="globalSearchResults" hidden></div></div>
        <div class="topbar-user"><div class="topbar-meta"><span class="badge success">وردية مفتوحة — تجريبي</span><time id="topbarClock"></time></div><button class="user-button" id="userMenuButton" type="button" aria-label="قائمة المستخدم"><span class="avatar" id="userAvatar">م</span><span class="user-copy"><strong id="userDisplayName">…</strong><small id="userRole">…</small></span></button></div>
      </header>
      <nav class="quickbar" id="quickbar" aria-label="الوصول السريع"></nav>
      <nav class="workspace-tabs" id="workspaceTabs" aria-label="مساحات العمل"></nav>
      <section class="workspace" id="workspace" tabindex="-1" aria-live="polite"></section>
      <footer class="statusbar"><div class="status-group"><span>الفرع الرئيسي</span><span>•</span><span id="statusUser">…</span><span>•</span><span>الوردية: تجريبية</span></div><div class="status-group"><span>آخر نسخة: غير متحقق</span><span>•</span><span class="success-text">● محلي</span><span>•</span><span>v0.2.0</span></div></footer>
    </main>
    <aside class="sidebar" id="sidebar" aria-label="التنقل الرئيسي">
      <div class="sidebar-head"><div class="sidebar-brand"><span class="brand-symbol brand-mark"><img src="assets/alkhayal-mark.png" alt=""></span><span>الخيال</span></div><button class="icon-button" id="sidebarToggle" type="button" title="طي القائمة الجانبية" aria-label="طي القائمة الجانبية"><span class="toggle-icon toggle-icon-close" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M4 4h16v16H4zM15 8l-4 4 4 4"></path></svg></span><span class="toggle-icon toggle-icon-open" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M4 4h16v16H4zM9 8l4 4-4 4"></path></svg></span></button></div>
      <nav class="sidebar-scroll" id="sidebarNavigation"></nav>
      <div class="sidebar-footer">
        <div class="theme-strip" role="group" aria-label="المظهر"><button type="button" data-theme-choice="light" title="فاتح"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg><span class="footer-label">فاتح</span></button><button type="button" data-theme-choice="dark" title="داكن"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15.2A8 8 0 0 1 8.8 4 8.5 8.5 0 1 0 20 15.2Z"></path></svg><span class="footer-label">داكن</span></button><button type="button" data-theme-choice="system" title="النظام"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"></rect><path d="M8 21h8M12 17v4"></path></svg><span class="footer-label">النظام</span></button></div>
        <button type="button" data-route="settings-program"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1M12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"></path></svg></span><span class="footer-label">الإعدادات</span></button><button type="button" id="logoutButton"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4H4v16h6M14 8l4 4-4 4M18 12H8"></path></svg></span><span class="footer-label">تسجيل الخروج</span></button>
      </div>
    </aside>
  </div>
  <div class="modal-layer" id="modalLayer" hidden></div><div class="toast-stack" id="toastStack" aria-live="assertive"></div>
  <script src="js/api-client.js"></script><script src="js/core/theme.js"></script><script src="js/core/utils.js"></script><script src="js/core/calculations.js"></script>
  <script src="js/mocks/data.js"></script><script src="js/services/mock-services.js"></script><script src="js/services/feature-state.js"></script><script src="js/services/access-state.js"></script><script src="js/services/settings-state.js"></script><script src="js/components/ui.js"></script><script src="js/modules/renderers.js"></script><script src="js/modules/business-activities.js"></script><script src="js/modules/feature-management.js"></script><script src="js/modules/settings-hub.js"></script><script src="js/modules/general-settings.js"></script><script src="js/modules/user-management.js"></script><script src="js/modules/dashboard.js"></script><script src="js/modules/pos.js"></script><script src="js/app.js"></script>
</body>
</html>
